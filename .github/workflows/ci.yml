name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      test_runner:
        description: Explicit runner for controlled comparisons
        type: choice
        options: [nextest, libtest]
        default: nextest
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

# Large executable fixtures are expensive at opt-level 0. Keep all checks on.
env:
  PACTRUN_TEST_RUNNER: ${{ inputs.test_runner || 'nextest' }}
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: Select verification scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      delivery: ${{ steps.scope.outputs.delivery }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint workflow syntax and expressions
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml
      - name: Verify CI policy tests
        run: |
          python3 -B -m unittest discover -s tools -p 'test_ci_policy.py'
          python3 -B -m unittest tools.test_measure_command
          node --test tools/test_pages_guard.mjs
      - name: Classify the complete change
        id: scope
        run: python3 tools/ci_scope.py

  ubuntu:
    name: Ubuntu verification
    needs: scope
    runs-on: ubuntu-latest
    # Unrelated tests must not inherit each other's file locks across fork/exec.
    # Explicit concurrency tests still create their own threads and processes.
    env:
      RUST_TEST_THREADS: '1'
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        if: needs.scope.outputs.runtime == 'true' || needs.scope.outputs.delivery == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          cache: true

      - name: Install pinned nextest
        if: needs.scope.outputs.runtime == 'true' && env.PACTRUN_TEST_RUNNER == 'nextest'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.148

      - name: Check PTY driver
        run: python3 --version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install documentation dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Read the configured Pages destination
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PACTRUN_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Run the shared verification entry point
        if: needs.scope.outputs.runtime == 'true'
        run: python3 -B tools/measure_command.py --output "${{ runner.temp }}/pactrun-verification/linux.json" --label linux-verification -- cargo xtask ci
        env:
          DOCUSAURUS_URL: ${{ steps.pages.outputs.origin || 'https://example.invalid' }}
          DOCUSAURUS_BASE_URL: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}

      - name: Verify documentation-only changes
        if: needs.scope.outputs.runtime == 'false'
        run: |
          pnpm --dir website run typecheck
          pnpm --dir website run build
        env:
          DOCUSAURUS_URL: ${{ steps.pages.outputs.origin || 'https://example.invalid' }}
          DOCUSAURUS_BASE_URL: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}

      - name: Upload the verified site without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PACTRUN_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - name: Verify public package definitions and immutable records
        if: needs.scope.outputs.delivery == 'true'
        run: |
          python3 -B -m unittest tools.test_release_catalog
          python3 tools/verify_release_catalog.py

      - name: Verify delivery-only changes with the catalog generator tests
        if: needs.scope.outputs.runtime == 'false' && needs.scope.outputs.delivery == 'true'
        run: cargo test --locked -p xtask --all-features

      - name: Retain verification timing and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verification-evidence
          path: |
            ${{ runner.temp }}/pactrun-verification/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore

  windows:
    name: Windows Rust verification
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          cache: true

      - name: Install pinned nextest
        if: env.PACTRUN_TEST_RUNNER == 'nextest'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.148

      - name: Set up the independent Node oracle
        uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version

      - name: Verify Windows oracle and canonical source prerequisites
        run: |
          node --version
          $spec = [IO.File]::ReadAllText('docs/spec/persistence/persistence-baseline.md')
          if ($spec.Contains("`r`n")) { throw 'Canonical Markdown must be checked out with LF line endings.' }

      - name: Run Rust verification
        run: python -B tools/measure_command.py --output "${{ runner.temp }}/pactrun-verification/windows.json" --label windows-verification -- cargo xtask rust-ci

      - name: Retain verification timing and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-evidence
          path: |
            ${{ runner.temp }}/pactrun-verification/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore

  debian12:
    name: Debian 12 artifact verification
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/linux-compatibility.yml

  gate:
    name: CI gate
    if: always()
    needs: [scope, ubuntu, windows, debian12]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable verification job
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          DEBIAN12_RESULT: ${{ needs.debian12.result }}
        run: |
          # BEGIN CI GATE
          test "$SCOPE_RESULT" = success
          test "$UBUNTU_RESULT" = success
          case "$RUNTIME" in
            true) test "$WINDOWS_RESULT" = success; test "$DEBIAN12_RESULT" = success ;;
            false) test "$WINDOWS_RESULT" = skipped; test "$DEBIAN12_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
          # END CI GATE

  pages:
    name: Publish verified documentation
    needs: gate
    # An intentionally skipped Windows ancestor must not suppress a passed gate.
    if: ${{ always() && !cancelled() && needs.gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PACTRUN_PAGES_ENABLED == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
