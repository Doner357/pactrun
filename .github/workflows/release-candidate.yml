name: Release candidate

# Produces reviewable artifacts only. Public upload/tagging is a separate gate.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full SHA in main or exact dispatched release/<version> head
        required: true
        type: string
      version:
        description: Exact Cargo product version (without v)
        required: true
        type: string
      baseline_version:
        description: Explicit published baseline for native installation/upgrade qualification
        required: true
        type: string
        default: 1.0.0-alpha.8

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: true
      - name: Build from a verified clean source snapshot
        shell: python
        env:
          REQUESTED_SHA: ${{ inputs.source_commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, re, subprocess, sys, tarfile, tomllib
          root = pathlib.Path.cwd()
          sha = os.environ['REQUESTED_SHA']
          version = os.environ['REQUESTED_VERSION']
          assert re.fullmatch('[0-9a-f]{40}', sha), 'Use a full source SHA'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == sha
          sys.path.insert(0, str(root/'tools'))
          from release_artifacts import qualify_candidate_source
          qualify_candidate_source(root, sha, version, os.environ['GITHUB_REF'], os.environ['GITHUB_SHA'])
          actual = tomllib.loads((root/'Cargo.toml').read_text())['package']['version']
          assert actual == version, 'Do not relabel a binary with a different version'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta|rc)\.[1-9][0-9]*)?', version)
          work = pathlib.Path(os.environ['RUNNER_TEMP'])/'pactrun-candidate'
          work.mkdir()
          snapshot, source, output = work/'snapshot', work/'source', work/'output'
          source.mkdir()
          tool = root/'tools/release_artifacts.py'
          subprocess.run([sys.executable,str(tool),'source','--root',str(root),'--output',str(snapshot)], check=True)
          with tarfile.open(snapshot/'source.tar.gz') as archive:
              archive.extractall(source, filter='data')
          subprocess.run(['cargo','fetch','--locked','--manifest-path',str(source/'Cargo.toml'),'--target',os.environ['BUILD_TARGET']], check=True)
          subprocess.run([sys.executable,str(tool),'build','--root',str(source),'--snapshot',str(snapshot),
                          '--output',str(output),'--platform',os.environ['BUILD_PLATFORM'],
                          '--url-base',f'https://github.com/Doner357/pactrun/releases/download/v{version}'], check=True)
          program = output/'cargo-target'/os.environ['BUILD_TARGET']/'release'/('pactrun.exe' if os.name=='nt' else 'pactrun')
          subprocess.run([str(program),'--version'], check=True)
          subprocess.run([str(program),'--help'], check=True)
      - name: Retain candidate artifacts and provenance for qualification
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/pactrun-candidate/output/assets/*
            ${{ runner.temp }}/pactrun-candidate/output/release-part.json
            ${{ runner.temp }}/pactrun-candidate/output/artifact-checksums.json
            ${{ runner.temp }}/pactrun-candidate/output/binary-probe.json
            ${{ runner.temp }}/pactrun-candidate/snapshot/*

  linux:
    name: Qualified Debian 12 Linux candidate
    uses: ./.github/workflows/linux-compatibility.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      candidate_version: ${{ inputs.version }}
      artifact_name: candidate-linux-x86_64

  native:
    name: Qualify exact native packages
    needs: [package, linux]
    uses: ./.github/workflows/native-qualification.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      version: ${{ inputs.version }}
      baseline_version: ${{ inputs.baseline_version }}

  catalog:
    name: Prepare qualified catalog for review
    needs: [native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidates
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: true
      - name: Build catalog tooling only
        run: cargo build --locked -p xtask
      - name: Generate catalog without modifying the checkout or publishing
        env:
          CANDIDATE_SOURCE: ${{ inputs.source_commit }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          python3 -B -m tools.qualify_candidate catalog \
            --artifacts "$RUNNER_TEMP/candidates" --source "$CANDIDATE_SOURCE" \
            --version "$CANDIDATE_VERSION" --xtask target/debug/xtask \
            --output "$RUNNER_TEMP/qualified-catalog"
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-catalog
          path: ${{ runner.temp }}/qualified-catalog/
          if-no-files-found: error
