<svg xmlns="http://www.w3.org/2000/svg" width="800" height="428" viewBox="0 0 800 428" role="img" aria-labelledby="title desc">
  <title id="title">Pactrun manages operations; your tools do the service-specific work</title>
  <desc id="desc">Pactrun keeps Pack versions, configuration and execution history per Instance. Pack Hooks define service-specific procedures and can combine service commands, service managers such as systemd, and Docker or Compose. Process supervision and container execution remain the responsibility of those tools. None is a universal prerequisite.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .heading { font-size: 21px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 17px; fill: #475569; }
    .label { font-size: 15px; fill: #475569; }
    .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="800" height="428" rx="18" fill="#f1f5f9"/>
  <rect x="100" y="24" width="600" height="100" rx="12" fill="#0f766e"/>
  <text x="400" y="61" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Pactrun</text>
  <text x="400" y="91" text-anchor="middle" font-size="18" fill="#ffffff">Pack versions · Configuration · Execution history</text>
  <text x="400" y="114" text-anchor="middle" font-size="15" fill="#ffffff">Kept together for each Instance.</text>
  <path d="M 400 124 V 174" class="line"/>
  <text x="420" y="154" class="label">executes the Pack's procedures</text>
  <rect x="164" y="178" width="472" height="68" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="400" y="207" text-anchor="middle" class="heading">Pack Hooks</text>
  <text x="400" y="233" text-anchor="middle" class="body">Service-specific programs or scripts.</text>
  <path d="M 400 246 V 273 H 150 V 316" class="line"/>
  <path d="M 400 246 V 316" class="line"/>
  <path d="M 400 246 V 273 H 650 V 316" class="line"/>
  <text x="28" y="297" class="label">can combine</text>
  <rect x="28" y="320" width="244" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="278" y="320" width="244" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="528" y="320" width="244" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="150" y="351" text-anchor="middle" class="heading">Service commands</text>
  <text x="150" y="379" text-anchor="middle" class="body">The service's own operations</text>
  <text x="400" y="351" text-anchor="middle" class="heading">Service managers</text>
  <text x="400" y="379" text-anchor="middle" class="body">Process supervision</text>
  <text x="650" y="351" text-anchor="middle" class="heading">Docker / Compose</text>
  <text x="650" y="379" text-anchor="middle" class="body">Container execution</text>
  <text x="400" y="419" text-anchor="middle" class="label">Use the tools your service needs. Pactrun does not replace their runtime responsibilities.</text>
</svg>
