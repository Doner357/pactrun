<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="title desc">
  <title id="title">Package, Pack, and its contents</title>
  <desc id="desc">Pack is the only supported Package kind. A Pack supplies management definitions and runtime files.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <style>
    text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-anchor: middle;}
    .title {font-size: 23px; font-weight: 700; fill: #0f172a;}
    .body {font-size: 19px; fill: #334155;}
    .arrow {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow);}
  </style>
  <rect width="680" height="490" rx="18" fill="#f1f5f9"/>
  <rect x="80" y="24" width="520" height="90" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="title" x="340" y="59">Package</text>
  <text class="body" x="340" y="89">A continuing identity: package_id</text>
  <path class="arrow" d="M340 114V190"/>
  <text class="body" x="475" y="159">Supported kind</text>
  <rect x="80" y="198" width="520" height="90" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text class="title" x="340" y="234">Pack</text>
  <text class="body" x="340" y="264">Defines how to manage software or a service</text>
  <path class="arrow" d="M340 288V332H175V370"/>
  <path class="arrow" d="M340 332H505V370"/>
  <rect x="24" y="378" width="302" height="88" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text class="title" x="175" y="413">Management definition</text>
  <text class="body" x="175" y="443">Declarations Pactrun reads</text>
  <rect x="354" y="378" width="302" height="88" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text class="title" x="505" y="413">Runtime content</text>
  <text class="body" x="505" y="443">Supplied files, such as scripts</text>
</svg>
