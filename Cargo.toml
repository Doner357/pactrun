[package]
name = "pactrun"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/pactrun-windows-ntfs", "xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
fluent-uri = { version = "=0.4.1", default-features = false }
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
lexopt = "=0.3.2"
ctrlc = "=3.4.7"
yaml-rust2 = { version = "=0.11.0", default-features = false }
zip = { version = "=8.6.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process", "termios"] }
rustix-openpty = "0.2.0"

[target.'cfg(windows)'.dependencies]
pactrun-windows-ntfs = { path = "crates/pactrun-windows-ntfs" }

[dev-dependencies]
tempfile = "3"
