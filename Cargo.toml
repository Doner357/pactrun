[package]
name = "pactrun"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/pactrun-windows-ntfs", "xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
pactrun-windows-ntfs = { path = "crates/pactrun-windows-ntfs" }

[dev-dependencies]
tempfile = "3"
