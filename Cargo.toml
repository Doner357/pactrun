[package]
name = "pactrun"
version = "1.0.0-alpha.8"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/Doner357/pactrun"
default-run = "pactrun"

[workspace]
members = ["crates/pactrun-windows-ntfs", "xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
base64 = "=0.22.1"
fluent-uri = { version = "=0.4.1", default-features = false }
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
# Bundled SQLite 3.53.4 includes the Windows long DOS-device path locking fix.
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "901f9946efdaaa289e6b1c5bd56dc67f4b651e51", features = ["bundled"] }
lexopt = "=0.3.2"
ctrlc = "=3.4.7"
yaml-rust2 = { version = "=0.11.0", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
time = { version = "=0.3.55", features = ["formatting"] }
toml = "=0.9.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process", "termios", "pipe"] }
rustix-openpty = "0.2.0"

[target.'cfg(windows)'.dependencies]
pactrun-windows-ntfs = { path = "crates/pactrun-windows-ntfs" }

[dev-dependencies]
tempfile = "3"
schemars = "=1.2.2"
jsonschema = { version = "=0.57.0", default-features = false }
